# Smoke test for the one-liner script (nathwn12/vencord-bootstrap).
#
# Ported verbatim from the `script-smoke` job of the retired
# `.github/workflows/sync-upstream.yml`: dry-runs vencord-setup.ps1 on
# windows-latest so a broken user-facing entry point is caught on push.
# Runs standalone — no merge context, no schedule.
# Docs-only change (*.md, docs/, LICEN[CS]E) keeps the required check green in seconds and runs no build.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  script-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Detect a docs-only change
        id: scope
        shell: bash
        run: |
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            changed=$(git diff --name-only "${{ github.event.before }}" HEAD || true)
          else
            changed=$(git ls-files)
          fi
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE "$docs"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dry-run smoke test
        if: steps.scope.outputs.code == 'true'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File vencord-setup.ps1 -DryRun > "$env:RUNNER_TEMP\smoke-output.txt" 2>&1
          $code = $LASTEXITCODE
          Write-Host (Get-Content "$env:RUNNER_TEMP\smoke-output.txt" -Raw)
          if ($code -ne 0) {
            Write-Host "::error::vencord-setup.ps1 -DryRun exited $code (expected 0)"
            exit 1
          }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\smoke-output.txt" -Pattern 'Nothing to do\.' -Quiet)) {
            Write-Host "::error::expected 'Nothing to do.' output (no Discord on the runner), got the output above"
            exit 1
          }
      - name: Scope
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the full gate ran' || 'docs-only - build skipped, the check stays green' }}"
